services:

  backend:
    image: house-price-api
    container_name: house-price-api-container
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: house-price-frontend
    container_name: house-price-frontend-container
    ports:
      - "8501:8501"
    depends_on:
      - backend