name: House Price CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: house-prediction-system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.backend.txt
          pip install pytest httpx

      - name: Run tests
        run: |
          python -m pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build backend Docker image
        run: |
          docker build \
            -f house-prediction-system/Dockerfile \
            -t house-price-api:test \
            house-prediction-system

      - name: Build frontend Docker image
        run: |
          docker build \
            -f house-prediction-system/Dockerfile.frontend \
            -t house-price-frontend:test \
            house-prediction-system